
tasks.githubRelease.dependsOn(tasks.remapJar)
tasks.githubRelease.dependsOn(tasks.remapSourcesJar)

githubRelease {
    token = System.getenv("GH_TOKEN") ?: ""
    targetCommitish = "LTS"
    body = changelog_text
    tagName = "v" + mod_version
    releaseAssets = [file("build/libs/${archives_base_name}-${version}.jar") , file("build/libs/${archives_base_name}-${version}-sources.jar"), file("build/libs/${archives_base_name}-${version}-javadoc.jar")]
}